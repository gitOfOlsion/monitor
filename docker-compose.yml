#version: "3.9"

# ── Single version variable — matches Directory.Build.props DotNetVersion ──
x-dotnet-version: &dotnet-version "10.0"

services:

  db:
    image: postgres:17-alpine
    container_name: pm_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       peripheral_monitor
      POSTGRES_USER:     pm_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm_user -d peripheral_monitor"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [internal]

  seq:
    image: datalust/seq:latest
    container_name: pm_seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
    volumes:
      - seq_data:/data
    expose: ["80", "5341"]
    networks: [internal]

  server:
    build:
      context: .
      dockerfile: Server/Dockerfile
      args:
        DOTNET_VERSION: *dotnet-version
    container_name: pm_server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      seq:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT:           Production
      ConnectionStrings__Postgres:      "Host=db;Port=5432;Database=peripheral_monitor;Username=pm_user;Password=${DB_PASSWORD}"
      Jwt__Secret:                      ${JWT_SECRET}
      SuperAdminPassword:               ${SUPER_ADMIN_PASSWORD}
      PublicUrl:                        ${PUBLIC_URL:-http://localhost}
      RustDesk__ServerAddr:             ${PUBLIC_IP:-127.0.0.1}
      RustDesk__Password:               ${RUSTDESK_PASSWORD}
      RustDesk__Key:                    ${RUSTDESK_KEY}
      Seq__Url:                         http://seq:5341
    networks: [internal]
    expose: ["5000"]
    ports:
      - "5001:5001/udp"   # UDP multicast discovery from LAN agents

  web:
    build:
      context: .
      dockerfile: Web/Dockerfile
      args:
        DOTNET_VERSION: *dotnet-version
    container_name: pm_web
    restart: unless-stopped
    depends_on: [server, seq]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ServerApiUrl:           http://server:5000
      Seq__Url:               http://seq:5341
    networks: [internal]
    expose: ["5001"]

  caddy:
    image: caddy:2-alpine
    container_name: pm_caddy
    restart: unless-stopped
    depends_on: [web, server, seq]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

  # ── RustDesk self-hosted relay (remote desktop) ─────────────────────────
  # hbbs = ID/rendezvous server. hbbr = relay server for NAT traversal.
  # Agents + admin RustDesk clients connect to these via the VPS public IP.
  #
  # IMPORTANT: hbbs ALWAYS generates and enforces a real keypair
  # (id_ed25519/id_ed25519.pub) - there is no "disable key checking" flag on
  # this image version ("-k _" does NOT mean "no key", it's interpreted as a
  # literal key value, confirmed via "hbbs --help"). Every client (agents and
  # admin RustDesk clients) MUST be configured with the server's real public
  # key, or every connection fails with "Key mismatch".
  #
  # After first start, retrieve the key with:
  #   docker exec pm_hbbs cat id_ed25519.pub
  # and put it in .env as RUSTDESK_KEY. All install/configure scripts in this
  # project read RUSTDESK_KEY and pass it to every client automatically.
  hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: pm_hbbs
    restart: unless-stopped
    command: hbbs -r ${PUBLIC_IP:-127.0.0.1}:21117
    environment:
      ALWAYS_USE_RELAY: "Y"
    ports:
      - "21115:21115"     # NAT type test
      - "21116:21116"     # ID server (TCP)
      - "21116:21116/udp" # ID server (UDP, hole punching)
      - "21118:21118"     # ID server websocket
    volumes:
      - rustdesk_data:/root
    networks: [internal]

  hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: pm_hbbr
    restart: unless-stopped
    command: hbbr
    ports:
      - "21117:21117"     # Relay (TCP)
      - "21119:21119"     # Relay websocket
    volumes:
      - rustdesk_data:/root
    networks: [internal]

volumes:
  pg_data:
  seq_data:
  caddy_data:
  caddy_config:
  rustdesk_data:

networks:
  internal:
    driver: bridge
