# Guacamole configuration — Peripheral Monitor
#
# Authentication is handled entirely via the guacamole-auth-json extension
# (built into the official Docker image, enabled automatically by setting
# JSON_SECRET_KEY as an environment variable in docker-compose.yml — see that
# file for details). There is no Guacamole user database, no login screen,
# and no admin user: our dashboard generates short-lived, signed, encrypted
# connection tokens that Guacamole trusts directly.
#
# guacd connection (the protocol daemon that speaks RDP/VNC/SSH)
guacd-hostname: guacd
guacd-port:     4822
