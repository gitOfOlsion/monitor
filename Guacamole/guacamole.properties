# Guacamole configuration — Peripheral Monitor
# Authentication is handled externally (dashboard generates JWT tokens)
# guacd connection
guacd-hostname: guacd
guacd-port:     4822

# Extension: quickconnect allows the dashboard to pass connection params via URL
# The dashboard signs the URL with GUACAMOLE_SECRET so only our server can
# generate valid connection links.
extension-priority: quickconnect
